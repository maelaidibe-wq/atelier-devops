services:
  app-blue:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["blue"]
    ports:
      - "5001:5000"
    environment:
      REDIS_HOST: redis
      DEPLOY_COLOR: blue
      COMMIT_SHA: ${COMMIT_SHA:-unknown}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  app-green:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["green"]
    ports:
      - "5002:5000"
    environment:
      REDIS_HOST: redis
      DEPLOY_COLOR: green
      COMMIT_SHA: ${COMMIT_SHA:-unknown}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - redis
    networks:
      - app-network

volumes:
  redis-data:

networks:
  app-network:
