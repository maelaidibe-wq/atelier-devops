name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('starter-app/starter-app2/requirements.txt') }}

      - name: Installer les dependances
        working-directory: starter-app/starter-app2
        run: pip install -r requirements.txt

      - name: Lancer Flake8
        working-directory: starter-app/starter-app2
        run: flake8 . --config=flake8-config.txt

  test:
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('starter-app/starter-app2/requirements.txt') }}

      - name: Installer les dependances
        working-directory: starter-app/starter-app2
        run: pip install -r requirements.txt

      - name: Lancer les tests avec couverture
        working-directory: starter-app/starter-app2
        run: pytest --cov=. --cov-report=html

      - name: Sauvegarder le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.python-version }}
          path: starter-app/starter-app2/htmlcov/
